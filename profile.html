<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Lift or Leave It</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--teal:#2CB98A;--amber:#E09020;--red:#CC3333;--card:rgba(14,16,14,0.95);--border:rgba(255,255,255,0.08);--font-title:'Bebas Neue',sans-serif;--font-ui:'Rajdhani',sans-serif;--font-body:'Barlow',sans-serif}
    html,body{min-height:100%;background:#080808;color:#fff;font-family:var(--font-body)}
    .bg{position:fixed;inset:0;background:url('assets/warehouse-bg.jpg') center/cover no-repeat;filter:brightness(0.12) saturate(0.5);z-index:0;pointer-events:none}
    .page{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:2rem 1.2rem 4rem}
    .top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;gap:1rem;flex-wrap:wrap}
    .nav-brand{font-family:var(--font-title);font-size:1.4rem;letter-spacing:0.18em;color:var(--teal);text-decoration:none}
    .nav-actions{display:flex;gap:0.6rem}
    .nav-btn{font-family:var(--font-ui);font-size:0.76rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:0.4rem 1rem;border-radius:6px;cursor:pointer;text-decoration:none;border:none;transition:background 0.15s}
    .nav-btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.6)}
    .nav-btn-ghost:hover{background:rgba(255,255,255,0.07);color:#fff}
    .nav-btn-danger{background:rgba(204,51,51,0.12);border:1px solid rgba(204,51,51,0.35);color:#F07070}
    .nav-btn-danger:hover{background:rgba(204,51,51,0.22)}
    .page-title{font-family:var(--font-title);font-size:2.8rem;letter-spacing:0.2em}
    .page-subtitle{font-size:0.85rem;color:rgba(255,255,255,0.35);margin-top:0.3rem;margin-bottom:2rem}
    .tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:2rem}
    .tab-btn{font-family:var(--font-ui);font-size:0.82rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;padding:0.7rem 1.4rem;background:none;border:none;color:rgba(255,255,255,0.40);cursor:pointer;border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s}
    .tab-btn.active{color:var(--teal);border-bottom-color:var(--teal)}
    .tab-panel{display:none}.tab-panel.active{display:block}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.2rem 1rem;text-align:center}
    .stat-value{font-family:var(--font-title);font-size:2.2rem;color:var(--teal);letter-spacing:0.06em}
    .stat-label{font-family:var(--font-ui);font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.38);margin-top:0.2rem}
    .detail-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.4rem 1.6rem;margin-bottom:1.5rem}
    .detail-row{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.05)}
    .detail-row:last-child{border-bottom:none}
    .detail-key{font-family:var(--font-ui);font-size:0.78rem;letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.40)}
    .detail-val{font-size:0.92rem;color:rgba(255,255,255,0.85);font-weight:500}
    .session-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:0.9rem;overflow:hidden;transition:border-color 0.15s}
    .session-card:hover{border-color:rgba(44,185,138,0.30)}
    .session-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;padding:1rem 1.2rem;cursor:pointer;user-select:none}
    .session-date{font-size:0.84rem;color:rgba(255,255,255,0.45)}
    .session-score{font-family:var(--font-title);font-size:1.6rem;color:#fff;letter-spacing:0.06em}
    .session-badges{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center}
    .badge{font-family:var(--font-ui);font-size:0.68rem;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;padding:0.2rem 0.6rem;border-radius:999px}
    .badge-pass{background:rgba(44,185,138,0.18);color:var(--teal);border:1px solid rgba(44,185,138,0.35)}
    .badge-fail{background:rgba(204,51,51,0.15);color:#F07070;border:1px solid rgba(204,51,51,0.30)}
    .badge-best{background:rgba(44,185,138,0.18);color:var(--teal)}
    .badge-good{background:rgba(224,144,32,0.18);color:var(--amber)}
    .badge-wrong{background:rgba(204,51,51,0.15);color:#F07070}
    .badge-skipped{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.45)}
    .session-meta{font-size:0.78rem;color:rgba(255,255,255,0.35)}
    .session-chevron{font-size:0.8rem;color:rgba(255,255,255,0.30);transition:transform 0.2s}
    .session-card.expanded .session-chevron{transform:rotate(180deg)}
    .choices-body{border-top:1px solid rgba(255,255,255,0.06);padding:0 1.2rem 1rem;display:none}
    .session-card.expanded .choices-body{display:block}
    .choice-row{padding:0.75rem 0;border-bottom:1px solid rgba(255,255,255,0.04)}
    .choice-row:last-child{border-bottom:none}
    .choice-top{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap}
    .choice-name{font-size:0.88rem;color:rgba(255,255,255,0.82);font-weight:500}
    .choice-pos{font-size:0.78rem;color:rgba(255,255,255,0.35)}
    .choice-pts{font-family:var(--font-ui);font-size:0.80rem;color:rgba(255,255,255,0.50);margin-left:auto}
    .choice-feedback{font-size:0.78rem;color:rgba(255,255,255,0.40);font-style:italic;margin-top:0.15rem}
    .empty-state{text-align:center;padding:3rem 1rem;color:rgba(255,255,255,0.25);font-size:0.92rem}
    .loading{text-align:center;padding:2rem;color:rgba(255,255,255,0.35);font-size:0.88rem}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="page">
    <nav class="top-nav">
      <a href="/index.html" class="nav-brand">LIFT OR LEAVE IT</a>
      <div class="nav-actions">
        <a href="/index.html" class="nav-btn nav-btn-ghost">← Back</a>
        <button onclick="AUTH.logout()" class="nav-btn nav-btn-danger">Log Out</button>
      </div>
    </nav>
    <h1 class="page-title">MY PROFILE</h1>
    <p class="page-subtitle" id="profile-sub">Loading...</p>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('details',this)">My Details</button>
      <button class="tab-btn" onclick="switchTab('history',this)">Game History</button>
    </div>
    <div id="tab-details" class="tab-panel active">
      <div class="stats-grid" id="stats-grid"><div class="loading">Loading...</div></div>
      <div class="detail-card" id="detail-card"><div class="loading">Loading...</div></div>
    </div>
    <div id="tab-history" class="tab-panel">
      <div id="history-list"><div class="loading">Loading history...</div></div>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script>
    AUTH.requireLogin();
    function switchTab(name,btn){
      document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
      document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active')});
      btn.classList.add('active');
      document.getElementById('tab-'+name).classList.add('active');
    }
    function fmt(iso){if(!iso)return '—';return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
    function oc(o){return{best:'badge-best',good:'badge-good',wrong:'badge-wrong',skipped:'badge-skipped'}[o]||'badge-skipped'}

    AUTH.authFetch('/api/users/me').then(function(r){return r.json()}).then(function(u){
      document.getElementById('profile-sub').textContent = '@'+u.username+' — '+u.email;
      document.getElementById('stats-grid').innerHTML =
        '<div class="stat-card"><div class="stat-value">'+u.total_sessions+'</div><div class="stat-label">Sessions</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+u.avg_score+'</div><div class="stat-label">Avg Score</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+u.best_score+'</div><div class="stat-label">Best Score</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+u.pass_rate+'%</div><div class="stat-label">Pass Rate</div></div>';
      document.getElementById('detail-card').innerHTML =
        '<div class="detail-row"><span class="detail-key">Username</span><span class="detail-val">'+u.username+'</span></div>'+
        '<div class="detail-row"><span class="detail-key">Email</span><span class="detail-val">'+u.email+'</span></div>'+
        '<div class="detail-row"><span class="detail-key">Warehouse Role</span><span class="detail-val">'+(u.job_role||'—')+'</span></div>'+
        '<div class="detail-row"><span class="detail-key">Account Type</span><span class="detail-val">'+u.role+'</span></div>'+
        '<div class="detail-row"><span class="detail-key">Account created</span><span class="detail-val">'+fmt(u.created_at)+'</span></div>';
    }).catch(function(){document.getElementById('profile-sub').textContent='Could not load profile.'});

    AUTH.authFetch('/api/sessions/history').then(function(r){return r.json()}).then(function(sessions){
      var list = document.getElementById('history-list');
      if (!sessions.length){list.innerHTML='<div class="empty-state">No sessions yet. Play a game to see your history!</div>';return}
      list.innerHTML = sessions.map(function(s,i){
        var passClass = s.passed?'badge-pass':'badge-fail';
        var passText  = s.passed?'PASS':'FAIL';
        var choicesHTML = (s.choices||[]).map(function(c){
          return '<div class="choice-row">'+
            '<div class="choice-top">'+
              '<span class="choice-name">'+c.package_name+'</span>'+
              '<span class="badge '+oc(c.outcome)+'">'+c.outcome+'</span>'+
              '<span class="choice-pts">'+(c.points>0?'+':'')+c.points+' pts</span>'+
            '</div>'+
            '<div class="choice-pos">'+c.position_label+' — '+c.technique_chosen+'</div>'+
            '<div class="choice-feedback">'+c.feedback_text+'</div>'+
          '</div>';
        }).join('');
        return '<div class="session-card" id="sc-'+i+'">'+
          '<div class="session-header" onclick="document.getElementById(\'sc-'+i+'\').classList.toggle(\'expanded\')">'+
            '<div><div class="session-date">'+fmt(s.completed_at)+'</div>'+
            '<div class="session-score">'+s.total_score+' <span style="font-size:1rem;color:rgba(255,255,255,0.35)">/ 100</span></div></div>'+
            '<div class="session-badges">'+
              '<span class="badge '+passClass+'">'+passText+'</span>'+
              (s.ended_early?'<span class="badge" style="background:rgba(224,144,32,0.15);color:#E09020">ENDED EARLY</span>':'')+
            '</div>'+
            '<div class="session-meta">Tech: +'+s.technique_score+' | Time: +'+s.time_bonus+' | Bonus: +'+s.injury_bonus+'</div>'+
            '<span class="session-chevron">▼</span>'+
          '</div>'+
          '<div class="choices-body">'+(choicesHTML||'<div style="padding:0.8rem 0;color:rgba(255,255,255,0.3);font-size:0.82rem">No choices recorded.</div>')+'</div>'+
        '</div>';
      }).join('');
    }).catch(function(){document.getElementById('history-list').innerHTML='<div class="empty-state">Could not load session history.</div>'});
  </script>
</body>
</html>
