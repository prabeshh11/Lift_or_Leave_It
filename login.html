<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Lift or Leave It</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--teal:#2CB98A;--card:rgba(14,16,14,0.95);--font-title:'Bebas Neue',sans-serif;--font-ui:'Rajdhani',sans-serif;--font-body:'Barlow',sans-serif}
    html,body{min-height:100%;background:#080808;font-family:var(--font-body);color:#fff;display:flex;align-items:center;justify-content:center}
    .bg{position:fixed;inset:0;background:url('assets/warehouse-bg.jpg') center/cover no-repeat;filter:brightness(0.18) saturate(0.6);z-index:0;pointer-events:none}
    .modal{position:relative;z-index:10;width:min(420px,96vw);background:var(--card);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:2.2rem 2.4rem 2rem;margin:2rem auto;box-shadow:0 24px 80px rgba(0,0,0,0.75)}
    .modal-title{font-family:var(--font-title);font-size:2.4rem;letter-spacing:0.22em;text-align:center;margin-bottom:0.4rem}
    .title-line{display:block;width:40px;height:2.5px;background:var(--teal);margin:0 auto 1.8rem;border-radius:2px}
    .banner{border-radius:6px;padding:0.65rem 1rem;font-size:0.84rem;margin-bottom:1.2rem;display:none}
    .banner-success{background:rgba(44,185,138,0.12);border:1px solid rgba(44,185,138,0.35);color:var(--teal)}
    .banner-error{background:rgba(204,51,51,0.12);border:1px solid rgba(204,51,51,0.35);color:#F07070}
    .field{margin-bottom:1.1rem}
    .field label{display:block;font-family:var(--font-ui);font-size:0.72rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:0.35rem}
    .field input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:0.75rem 1rem;color:#fff;font-family:var(--font-body);font-size:0.95rem;outline:none;transition:border-color 0.15s}
    .field input:focus{border-color:var(--teal)}
    .field input::placeholder{color:rgba(255,255,255,0.22)}
    .btn{display:flex;align-items:center;justify-content:center;width:100%;padding:0.9rem 2rem;border-radius:6px;font-family:var(--font-ui);font-size:1rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;border:none;transition:background 0.15s,transform 0.12s,box-shadow 0.15s;margin-top:0.4rem}
    .btn-primary{background:var(--teal);color:#fff;box-shadow:0 0 24px rgba(44,185,138,0.28)}
    .btn-primary:hover{background:#35D9A0;transform:translateY(-1px)}
    .btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .footer-link{text-align:center;margin-top:1.4rem;font-size:0.84rem;color:rgba(255,255,255,0.38)}
    .footer-link a{color:var(--teal);text-decoration:none;font-weight:600}
    .footer-link a:hover{text-decoration:underline}
    .close-btn{position:absolute;top:1rem;right:1rem;width:2rem;height:2rem;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.50);font-size:1rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:background 0.15s,color 0.15s,border-color 0.15s}
    .close-btn:hover{background:rgba(44,185,138,0.14);border-color:rgba(44,185,138,0.40);color:#2CB98A}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="modal">
    <a href="/index.html" class="close-btn" title="Back to home">✕</a>
    <h1 class="modal-title">SIGN IN</h1>
    <span class="title-line"></span>
    <div id="success-banner" class="banner banner-success">✓ Account created! Please sign in.</div>
    <div id="error-banner"   class="banner banner-error"></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="your@email.com" autocomplete="email" required maxlength="255">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required maxlength="128">
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary">Sign In →</button>
    </form>
    <p class="footer-link">No account? <a href="/register.html">Create one</a></p>
  </div>
  <script src="js/auth.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    if (params.get('success') === 'registered') document.getElementById('success-banner').style.display = 'block';
    if (AUTH.isLoggedIn()) window.location.replace(params.get('return') || '/index.html');
    var form = document.getElementById('login-form');
    var errBanner = document.getElementById('error-banner');
    var submitBtn = document.getElementById('submit-btn');
    function showError(msg){errBanner.textContent=msg;errBanner.style.display='block'}
    function hideError(){errBanner.style.display='none'}
    form.addEventListener('submit', async function(e) {
      e.preventDefault(); hideError();
      var email    = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      if (!email || !password) { showError('Please fill in both fields.'); return; }
      submitBtn.disabled = true; submitBtn.textContent = 'Signing in...';
      try {
        var res  = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
        var data = await res.json();
        if (!res.ok) { showError(data.error || 'Login failed.'); return; }
        AUTH._storeAuth(data.token, data.user);
        var dest = params.get('return') || '/index.html';
        // Always add toast=logged_in so any destination page can show the confirmation
        var sep = dest.indexOf('?') !== -1 ? '&' : '?';
        window.location.replace(dest + sep + 'toast=logged_in');
      } catch(err) {
        showError('Could not reach the server. Is the backend running?');
      } finally {
        submitBtn.disabled = false; submitBtn.textContent = 'Sign In →';
      }
    });
  </script>
</body>
</html>
